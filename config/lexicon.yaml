# 01 쿼리 구성 - 사용자가 요청에 직접 쓴 속성 감지 사전 (1차: 색상만)
# 형식: 속성 -> 대표값 -> 요청에 나올 수 있는 표현들
# 감지된 속성은 그래프 검색을 생략하고 이 대표값을 그대로 쓴다.
# 속성 이름(color 등)은 aspects.yaml 의 속성 이름과 같아야 한다.

attributes:
  color:
    빨강: [빨간색, 빨간, 붉은색, 붉은, 레드]
    주황: [주황색, 오렌지색]
    노랑: [노란색, 노란, 샛노란, 옐로]
    초록: [초록색, 녹색, 연두색, 연두, 그린]
    파랑: [파란색, 파란, 푸른색, 푸른, 블루]
    남색: [남색, 네이비]
    보라: [보라색, 퍼플]
    분홍: [분홍색, 핑크색, 핑크]
    갈색: [갈색, 밤색, 브라운]
    회색: [회색, 잿빛, 그레이]
    검정: [검은색, 검정색, 검은, 까만색, 까만, 블랙]
    하양: [흰색, 하얀색, 하얀, 새하얀, 흰, 화이트]

# 그릴 대상이 아닌 일반 명사 (대상 후보에서 제외)
ignore_words: [그림, 이미지, 사진, 일러스트, 모습, 장면, 느낌, 스타일, 색, 색깔, 색상,
               위, 아래, 옆, 앞, 뒤, 안, 속, 것, 수, 때, 정도,
               카드, 인포그래픽, 프로필, 회사, 기업, 종목, 정보, 요약]
