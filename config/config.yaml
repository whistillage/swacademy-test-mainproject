# 실행 설정
# 미정 항목은 각 플러그인의 name(과 params)만 바꾸면 교체된다.
# 사용 가능한 이름 확인: python run.py --list-plugins
# 비밀값(API 키)은 .env 에 두고 ${변수명} 으로 참조한다.

# ---------------------------------------------------------------- 플러그인

# 그래프 DB - OntoKG-EQ PSX 그래프 (RDF). SPARQL 질의 지원
#   json 저장소로 되돌리기: name: json, params: {path: data/graph/graph.json}
graph_store:
  name: rdf
  params:
    paths:
      - data/graph/psx/demo_psx.ttl    # 원본 (출처: data/graph/psx/SOURCE.md)
      - data/graph/psx/aliases_ko.ttl  # 한국어 별칭 (이 프로젝트에서 추가)
    index_classes: [":Company"]        # 대상 노드 찾기에 쓸 노드 종류
    name_predicates: [":hasCompanyName", "rdfs:label"]
    alias_predicates: [":hasCompanyIdentifier", "rdfs:label", "skos:altLabel"]

# 대상 노드 찾기용 임베딩 모델 (로컬, 무료)
#   더 높은 품질: model_name: BAAI/bge-m3, query_prefix: "", passage_prefix: ""
#   다운로드 없이 확인: name: hashing
embedder:
  name: sentence_transformers
  params:
    model_name: intfloat/multilingual-e5-small
    query_prefix: "query: "
    passage_prefix: "passage: "
    device: cpu

# 요청 분석기 - kiwi(형태소 분석) | simple(규칙 기반)
request_parser:
  name: kiwi
  params: {}

# 프롬프트 후처리 (영어 변환 여부 미정) - identity = 그대로
translator:
  name: identity
  params: {}

# 이미지 생성 모델 - HuggingFace diffusers, 로컬 GPU
#   model_id 만 바꾸면 다른 모델로 교체. GPU 없이 확인: name: dummy, params: {}
#   새 종류의 모델 추가: pipeline/plugins/image_generator/_template.py 참고
image_generator:
  name: diffusers
  params:
    model_id: black-forest-labs/FLUX.2-klein-4B
    quantization: nf4          # nf4 | int8 | null. 8GB GPU 는 nf4 (약 16GB -> 약 5GB)
    torch_dtype: bfloat16
    device: cuda
    cpu_offload: false
    num_inference_steps: 4     # FLUX.2-klein 권장값
    guidance_scale: 1.0

# ---------------------------------------------------------------- 단계 설정

# 01 쿼리 구성 - 대상 노드 찾기 (하이브리드 검색)
# 채택 기준값은 임베딩 모델과 실제 그래프가 정해지면 다시 맞춰야 한다.
linker:
  top_k: 5
  rrf_k: 60
  min_vector_score: 0.85
  min_keyword_overlap: 0.5
  include_description: true
  cache_dir: data/index

# 04 이미지 생성 - 모델과 무관한 공통 요청값
# 모델이 지원하지 않는 값은 플러그인이 무시할 수 있다. 모델 전용 옵션은 extra 에.
generation:
  width: 1024
  height: 1024
  num_images: 1
  seed: null
  extra: {}

# 04 카드 글자 합성 - templates.yaml 에 card 가 있으면 이미지 위에 Pillow 로 글자를 찍는다
# 항목 전체: pipeline/render/card.py 의 CardStyle. 폰트는 자동 탐색 (맑은 고딕 등)
overlay:
  enabled: true
  side: left
  panel_opacity: 0.78

# ---------------------------------------------------------------- 파일

files:
  aspects: config/aspects.yaml      # 노드 종류별 속성 체크리스트
  templates: config/templates.yaml  # 프롬프트 템플릿
  lexicon: config/lexicon.yaml      # 사용자 지정 속성 사전

output_dir: output
